<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Comptage rouleaux</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
<style>
/* VOICE: outil de rayon, net et rapide, lisible debout avec un mètre à la main
   IDEA: une fiche de comptage d'inventaire — grosses cases, gros résultat
   PICTURE: le résultat calculé en direct, très grand, à côté de la coupe du rouleau
   COLOUR and TYPE: blanc, noir, rouge signal #e4002b, un gris ; Archivo large 800
   LAYOUT: saisie + résultat en haut, liste d'inventaire et totaux dessous */
:root{color-scheme:light dark;--bg:light-dark(#fff,#0e0e0e);--ink:light-dark(#111,#f2f2f2);--grey:light-dark(#6b6b6b,#a0a0a0);--line:light-dark(#e3e3e3,#2a2a2a);--soft:light-dark(#f4f4f4,#1a1a1a);--red:#e4002b}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Archivo,system-ui,sans-serif;overflow-x:clip}
.band{padding:clamp(20px,4vw,48px) max(5vw,16px);max-width:1100px;margin:0 auto}
header.band{border-top:8px solid var(--ink);padding-bottom:8px}
h1{font-stretch:112%;font-weight:800;font-size:clamp(30px,6vw,46px);line-height:1.05;margin:0 0 6px;text-wrap:balance}
.sub{color:var(--grey);margin:0}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(20px,4vw,48px);align-items:start}
@media(max-width:700px){.grid{grid-template-columns:minmax(0,1fr)}}
label{display:block;font-weight:600;margin:0 0 6px}
.field{margin-bottom:18px}
input[type=number],input[type=text]{width:100%;font:inherit;font-size:22px;font-weight:700;padding:12px 14px;border:2px solid var(--ink);border-radius:6px;background:var(--bg);color:var(--ink);min-height:56px}
input:focus-visible,button:focus-visible,summary:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.hint{font-size:14px;color:var(--grey);margin-top:4px}
.seg{display:grid;grid-template-columns:1fr 1fr;border:2px solid var(--ink);border-radius:6px;overflow:hidden}
.seg button{font:inherit;font-size:20px;font-weight:800;min-height:56px;border:0;background:var(--bg);color:var(--ink);cursor:pointer}
.seg button+button{border-left:2px solid var(--ink)}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.result{background:var(--soft);border-radius:10px;padding:clamp(18px,3vw,28px);position:sticky;top:12px}
.big{font-stretch:112%;font-weight:800;font-size:clamp(52px,12vw,92px);line-height:1;color:var(--red);white-space:nowrap}
.big small{font-size:.4em;color:var(--ink);margin-left:6px}
.rlabel{font-weight:600;margin-bottom:4px}
.steps{margin:16px 0 0;padding:0;list-style:none;font-size:15px;border-top:1px solid var(--line)}
.steps li{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line)}
.steps b{white-space:nowrap;font-variant-numeric:tabular-nums}
.btn{font:inherit;font-weight:700;font-size:17px;min-height:52px;padding:0 20px;border-radius:6px;border:2px solid var(--ink);background:var(--bg);color:var(--ink);cursor:pointer}
.btn.main{background:var(--red);border-color:var(--red);color:#fff;width:100%;margin-top:18px;font-size:19px}
.btn:disabled{opacity:.4;cursor:not-allowed}
svg.roll{width:100%;max-width:220px;height:auto;display:block;margin:0 auto 14px}
h2{font-stretch:112%;font-weight:800;font-size:28px;margin:0 0 14px;border-top:4px solid var(--ink);padding-top:14px}
.totals{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.tot{background:var(--soft);border-radius:8px;padding:14px}
.tot .n{font-stretch:112%;font-weight:800;font-size:30px;white-space:nowrap}
.tot .l{font-size:14px;color:var(--grey)}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line)}
th{font-size:14px;color:var(--grey);font-weight:600}
td.num,th.num{text-align:right;white-space:nowrap}
.del{font:inherit;border:0;background:none;color:var(--red);font-weight:700;min-height:44px;min-width:44px;cursor:pointer}
.empty{color:var(--grey);padding:18px 0}
.bar{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.toast{min-height:24px;color:var(--grey);font-size:14px;margin-top:8px}
details{margin-top:18px;font-size:15px}
summary{cursor:pointer;font-weight:600;min-height:44px;display:flex;align-items:center}
.sprow{display:flex;gap:8px;flex-wrap:wrap}
.sprow input{flex:1 1 140px;width:auto}
.btn.photo{display:inline-flex;align-items:center;justify-content:center;min-height:56px;margin:0;font-weight:700;background:var(--ink);color:var(--bg);border-color:var(--ink);flex:1 1 160px}
.btn.photo:hover{background:var(--red);border-color:var(--red);color:#fff}
#pz{margin-top:10px}
[hidden]{display:none!important}
input[type=file]{position:absolute;width:1px;height:1px;opacity:0}
.drop{display:flex;align-items:center;justify-content:center;min-height:170px;border:2px dashed var(--grey);border-radius:10px;cursor:pointer;font-weight:700;font-size:19px;text-align:center;padding:16px;margin:0}
.drop:hover{border-color:var(--red);color:var(--red)}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0;align-items:center}
.tools .btn{min-height:48px;font-size:16px;padding:0 14px}
.tools .btn[aria-pressed=true]{background:var(--ink);color:var(--bg)}
input[type=range]{flex:1;min-width:140px;height:44px;accent-color:var(--red)}
.pwrap{overflow:auto;max-height:72vh;border:2px solid var(--ink);border-radius:8px;background:var(--soft)}
#pimg{display:block;width:100%;max-height:220px;object-fit:contain;border:2px solid var(--ink);border-radius:8px;background:var(--soft)}
.instr{font-weight:600;font-size:17px;margin:4px 0 10px;padding:10px 12px;border-left:4px solid var(--red);background:var(--soft)}
.ptot{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:14px}
@media(max-width:600px){table{font-size:14px}.stack thead{display:none}.stack tr{display:grid;padding-block:10px;border-bottom:1px solid var(--line)}.stack td{display:flow-root;border:0;padding:3px 0;padding-inline-start:8em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:7.5em;margin-inline-start:-8em;color:var(--grey)}.stack td:empty{display:none}.result{position:static}}
</style>
<script>new MutationObserver(()=>{for(const c of document.querySelectorAll('.stack td:not([data-l])')){let i=0,p=c;while(p=p.previousElementSibling)i+=p.colSpan;c.dataset.l=c.closest('table').rows[0].cells[i]?.textContent||''}}).observe(document,{childList:true,subtree:true})</script>
</head>
<body>
<header class="band">
  <h1>Comptage des rouleaux</h1>
  <p class="sub">Mesurez le tour du rouleau, comptez les spires, ajoutez à l'inventaire.</p>
</header>


<main class="band grid">
  <form id="f" novalidate>
    <div class="field">
      <label>Largeur du rouleau</label>
      <div class="seg" id="wseg" role="group" aria-label="Largeur du rouleau">
        <button type="button" data-w="2" aria-pressed="true">2 m</button>
        <button type="button" data-w="4" aria-pressed="false">4 m</button>
      </div>
    </div>
    <div class="field">
      <label for="tour">Tour du rouleau (m)</label>
      <input id="tour" type="number" inputmode="decimal" step="0.01" min="0" placeholder="ex. 1,25">
      <div class="hint">Mesuré au mètre ruban, tout autour du rouleau.</div>
    </div>
    <div class="field">
      <label for="spires">Nombre de spires</label>
      <div class="sprow">
        <input id="spires" type="number" inputmode="numeric" step="1" min="0" placeholder="ex. 20">
        <label class="btn photo" for="file" id="drop" hidden>Compter sur photo</label>
      </div>
      <input id="file" type="file" accept="image/*">
      <div id="pz" hidden>
        <img id="pimg" alt="Photo du rouleau">
        <p class="hint" id="pstat" aria-live="polite"></p>
        <div class="tools" id="pres" hidden>
          <button type="button" class="btn" id="pminus" aria-label="Retirer une spire">− 1</button>
          <button type="button" class="btn" id="pplus" aria-label="Ajouter une spire">+ 1</button>
          <button type="button" class="btn" id="pgo">Recompter</button>
        </div>
      </div>
    </div>
    <div class="field">
      <label for="ref">Référence ou nom (facultatif)</label>
      <input id="ref" type="text" placeholder="ex. Lino gris béton" style="font-size:18px;font-weight:500">
    </div>
    <details>
      <summary>Réglage : tour du tube</summary>
      <div class="field" style="margin-top:8px">
        <label for="tube">Tour du tube (m)</label>
        <input id="tube" type="number" inputmode="decimal" step="0.01" min="0" value="0.34">
      </div>
    </details>
  </form>

  <section class="result" aria-live="polite">
    <svg class="roll" viewBox="0 0 220 120" aria-hidden="true">
      <ellipse cx="110" cy="104" rx="92" ry="10" fill="currentColor" opacity=".08"/>
      <rect x="40" y="18" width="140" height="80" rx="6" fill="currentColor" opacity=".12"/>
      <g id="rings"></g>
      <circle cx="48" cy="58" r="9" fill="var(--bg)" stroke="currentColor" stroke-width="3"/>
    </svg>
    <div class="rlabel">Résultat</div>
    <div class="big" id="res">—<small>m²</small></div>
    <ul class="steps" id="steps"></ul>
    <button class="btn main" id="add" type="button" disabled>Ajouter à l'inventaire</button>
  </section>
</main>

<section class="band">
  <h2>Inventaire</h2>
  <div class="totals" id="totals"></div>
  <div id="list"></div>
  <div class="field" style="max-width:420px;margin-top:18px">
    <label for="rayon">Rayon / zone pour le PDF (facultatif)</label>
    <input id="rayon" type="text" placeholder="ex. Revêtements de sol" style="font-size:18px;font-weight:500">
  </div>
  <div class="bar">
    <button class="btn main" id="pdf" type="button" style="width:auto;margin:0">Télécharger le PDF du stock</button>
    <button class="btn" id="copy" type="button">Copier le récapitulatif</button>
    <button class="btn" id="undo" type="button" hidden>Annuler la suppression</button>
    <button class="btn" id="clear" type="button">Vider l'inventaire</button>
  </div>
  <div class="toast" id="toast"></div>
</section>

<script src="lib/jspdf.umd.min.js"></script>
<script src="lib/jspdf.plugin.autotable.min.js"></script>
<script>
{
const $=id=>document.getElementById(id);
const KEY='comptage-rouleaux-v1';
let width=2, items=[], lastDeleted=null, confirmClear=false;
try{const s=JSON.parse(localStorage.getItem(KEY)||'{}');items=Array.isArray(s.items)?s.items:[];if(s.tube)$('tube').value=s.tube;if(s.rayon)$('rayon').value=s.rayon;}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify({items,tube:$('tube').value,rayon:$('rayon').value}))}catch(e){}};
const num=v=>parseFloat(String(v).replace(',','.'));
const fmt=(n,d=2)=>n.toLocaleString('fr-FR',{minimumFractionDigits:d,maximumFractionDigits:d});
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toast=t=>{$('toast').textContent=t;clearTimeout(toast.t);toast.t=setTimeout(()=>$('toast').textContent='',3500)};

function calc(){
  const tour=num($('tour').value), sp=num($('spires').value), tube=num($('tube').value);
  if(!(tour>0)||!(sp>0)||!(tube>=0)) return null;
  const a=tour+tube, b=a/2, c=b*sp, r=c*width;
  return {tour,sp,tube,a,b,c,r};
}
function drawRings(sp){
  const n=Math.max(1,Math.min(8,Math.round((sp||4)/4)));
  $('rings').innerHTML=Array.from({length:n},(_,i)=>`<circle cx="48" cy="58" r="${12+i*4}" fill="none" stroke="currentColor" stroke-width="1.6" opacity="${.35+.08*i}"/>`).join('');
}
function render(){
  const k=calc();
  drawRings(k?k.sp:0);
  if(!k){
    $('res').innerHTML='—<small>m²</small>';
    $('steps').innerHTML='<li><span>Saisissez le tour et le nombre de spires</span></li>';
    $('add').disabled=true;return;
  }
  $('res').innerHTML=`${fmt(k.r)}<small>m²</small>`;
  $('steps').innerHTML=[
    [`Tour + tube (${fmt(k.tour)} + ${fmt(k.tube)})`,fmt(k.a)+' m'],
    ['÷ 2',fmt(k.b)+' m'],
    [`× ${k.sp} spires`,fmt(k.c)+' m'],
    [`× ${width} m de largeur`,fmt(k.r)+' m²']
  ].map(([l,v])=>`<li><span>${l}</span><b>${v}</b></li>`).join('');
  $('add').disabled=false;
}
function renderList(){
  const t2=items.filter(i=>i.w===2), t4=items.filter(i=>i.w===4);
  const sum=a=>a.reduce((s,i)=>s+i.r,0);
  $('totals').innerHTML=[
    ['Rouleaux 2 m',sum(t2),t2.length],['Rouleaux 4 m',sum(t4),t4.length],['Total',sum(items),items.length]
  ].map(([l,v,n])=>`<div class="tot"><div class="l">${l} · ${n} rouleau${n>1?'x':''}</div><div class="n">${fmt(v)} m²</div></div>`).join('');
  if(!items.length){$('list').innerHTML='<div class="empty">Aucun rouleau compté pour l\'instant. Le premier calcul ajouté apparaîtra ici.</div>';return;}
  $('list').innerHTML=`<table class="stack"><thead><tr><th>#</th><th>Référence</th><th>Largeur</th><th class="num">Tour</th><th class="num">Spires</th><th class="num">Résultat</th><th></th></tr></thead><tbody>${
    items.map((i,n)=>`<tr><td>${n+1}</td><td>${esc(i.ref||'—')}</td><td>${i.w} m</td><td class="num">${fmt(i.tour)} m</td><td class="num">${i.sp}</td><td class="num"><b>${fmt(i.r)} m²</b></td><td class="num"><button class="del" data-i="${n}" aria-label="Supprimer la ligne ${n+1}">Suppr.</button></td></tr>`).join('')
  }</tbody></table>`;
}

document.querySelectorAll('#wseg button').forEach(b=>b.addEventListener('click',()=>{
  width=+b.dataset.w;
  document.querySelectorAll('#wseg button').forEach(x=>x.setAttribute('aria-pressed',x===b));
  render();
}));
['tour','spires','tube'].forEach(id=>$(id).addEventListener('input',()=>{render();if(id==='tube')save();}));

/* ---------- Mode photo (comptage IA) ---------- */
let blob=null, sample=null, busy=false;
const noAI=()=>{sample=null;$('drop').hidden=true;$('pz').hidden=true;};
(async()=>{
  try{
    const s=window.claude&&await window.claude.use('sample');
    if(!s){noAI();return;}
    const lim=await s.limits();
    if(!lim||!lim.images){noAI();return;}
    sample=s;$('drop').hidden=false;
  }catch(e){noAI();}
})();
function prep(file){
  return new Promise((ok,ko)=>{
    const url=URL.createObjectURL(file), im=new Image();
    im.onload=()=>{
      const m=Math.min(1,1568/Math.max(im.width,im.height)), c=document.createElement('canvas');
      c.width=Math.round(im.width*m);c.height=Math.round(im.height*m);
      c.getContext('2d').drawImage(im,0,0,c.width,c.height);
      c.toBlob(b=>b?ok({b,url:c.toDataURL('image/jpeg',.85)}):ko(),'image/jpeg',.9);
      URL.revokeObjectURL(url);
    };
    im.onerror=ko; im.src=url;
  });
}
$('file').addEventListener('change',async e=>{
  const f=e.target.files&&e.target.files[0]; e.target.value=''; if(!f) return;
  try{
    const r=await prep(f); blob=r.b; $('pimg').src=r.url;
    $('pz').hidden=false;$('pres').hidden=true;$('pstat').textContent='';$('drop').textContent='Autre photo';
    if(sample) $('pgo').click();
  }catch(err){toast('Impossible de lire cette image.');}
});
const PROMPT=`Tu analyses la photo de la tranche (face circulaire) d'un rouleau de revêtement (lino, moquette, gazon synthétique, toile...) enroulé autour d'un tube en carton.
Compte le nombre de spires, c'est-à-dire de tours de matériau enroulés entre le tube et le bord extérieur. Ne compte pas le tube.
Méthode : choisis un rayon bien net allant du bord du tube jusqu'au bord extérieur et compte chaque couche une par une le long de ce rayon. Recompte sur un deuxième rayon, de l'autre côté, pour vérifier. Si les deux comptes diffèrent, donne la valeur la plus probable et l'écart dans mini/maxi.
Réponds UNIQUEMENT avec un objet JSON, sans texte autour :
{"spires": entier, "mini": entier, "maxi": entier, "confiance": "bonne" | "moyenne" | "faible", "remarque": "une phrase courte en français (ex. conseil pour une meilleure photo)"}
Si la photo ne montre pas la tranche d'un rouleau, mets "spires" à 0 et explique dans "remarque".`;
const setSp=n=>{n=Math.max(0,n);$('spires').value=n||'';render();};
$('pgo').addEventListener('click',async()=>{
  if(!sample||!blob||busy) return;
  busy=true;$('pgo').disabled=true;$('pstat').textContent='Analyse de la photo en cours…';
  try{
    const r=await sample(PROMPT,{images:[blob],modelTier:'complex'});
    const m=String(r.text||'').match(/\{[\s\S]*\}/);
    const d=m?JSON.parse(m[0]):null;
    const n=d?Math.round(Number(d.spires)):NaN;
    if(!d||!isFinite(n)) throw {code:'parse'};
    $('pstat').textContent='';
    if(n<=0){$('pstat').textContent=String(d.remarque||'Aucun rouleau reconnu sur la photo.');return;}
    setSp(n);
    const range=(d.mini&&d.maxi&&d.mini!==d.maxi)?` · entre ${Number(d.mini)} et ${Number(d.maxi)}`:'';
    $('pstat').textContent=`${n} spires détectées · confiance ${String(d.confiance||'?')}${range}. ${String(d.remarque||'')}`;
  }catch(err){
    if(err&&err.code==='not_granted'){noAI();$('pstat').textContent='';}
    else if(err&&err.code==='rate_limited') $('pstat').textContent='Trop de demandes d’affilée. Réessayez dans une minute.';
    else $('pstat').textContent='L’analyse n’a pas abouti. Réessayez ou reprenez la photo.';
  }finally{busy=false;$('pgo').disabled=!sample;$('pres').hidden=false;}
});
$('pminus').addEventListener('click',()=>setSp((parseInt($('spires').value)||0)-1));
$('pplus').addEventListener('click',()=>setSp((parseInt($('spires').value)||0)+1));
$('f').addEventListener('submit',e=>{e.preventDefault();$('add').click();});
$('spires').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();$('add').click();}});

$('add').addEventListener('click',()=>{
  const k=calc(); if(!k) return;
  items.push({w:width,tour:k.tour,sp:k.sp,tube:k.tube,r:k.r,ref:$('ref').value.trim()});
  save();renderList();
  $('tour').value='';$('spires').value='';$('ref').value='';$('pz').hidden=true;blob=null;$('drop').textContent='Compter sur photo';render();$('tour').focus();
  toast(`Rouleau ajouté : ${fmt(k.r)} m²`);
});
$('list').addEventListener('click',e=>{
  const b=e.target.closest('.del'); if(!b) return;
  const i=+b.dataset.i; lastDeleted={i,item:items[i]};
  items.splice(i,1);save();renderList();$('undo').hidden=false;toast('Ligne supprimée.');
});
$('undo').addEventListener('click',()=>{
  if(!lastDeleted) return;
  items.splice(lastDeleted.i,0,lastDeleted.item);lastDeleted=null;save();renderList();$('undo').hidden=true;toast('Ligne restaurée.');
});
$('clear').addEventListener('click',()=>{
  if(!items.length) return;
  if(!confirmClear){confirmClear=true;$('clear').textContent='Confirmer : tout vider';setTimeout(()=>{confirmClear=false;$('clear').textContent="Vider l'inventaire"},4000);return;}
  confirmClear=false;$('clear').textContent="Vider l'inventaire";
  items=[];lastDeleted=null;$('undo').hidden=true;save();renderList();toast('Inventaire vidé.');
});
$('copy').addEventListener('click',async()=>{
  const sum=w=>items.filter(i=>w?i.w===w:true).reduce((s,i)=>s+i.r,0);
  const lines=['Inventaire rouleaux — '+new Date().toLocaleDateString('fr-FR'),
    ...items.map((i,n)=>`${n+1}. ${i.ref||'Sans réf.'} — ${i.w} m — tour ${fmt(i.tour)} m — ${i.sp} spires — ${fmt(i.r)} m²`),
    '',`Total 2 m : ${fmt(sum(2))} m²`,`Total 4 m : ${fmt(sum(4))} m²`,`Total : ${fmt(sum())} m²`];
  try{await navigator.clipboard.writeText(lines.join('\n'));toast('Récapitulatif copié.');}
  catch(e){toast('Copie impossible ici — sélectionnez le tableau à la main.');}
});

/* ---------- PDF ---------- */
let downloads=null;
$('rayon').addEventListener('input',save);
(async()=>{try{const d=window.claude&&await window.claude.use('downloads');if(d)downloads=d;}catch(e){}})();
const fp=(n,d=2)=>fmt(n,d).replace(/[  ]/g,' ');
$('pdf').addEventListener('click',async()=>{
  if(!items.length){toast('L’inventaire est vide : ajoutez au moins un rouleau.');return;}
  if(!window.jspdf||!window.jspdf.jsPDF){toast('Le module PDF n’a pas pu se charger. Rechargez la page.');return;}
  const doc=new window.jspdf.jsPDF({unit:'mm',format:'a4'});
  const now=new Date(), ds=now.toLocaleDateString('fr-FR'), ts=now.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
  const g={2:items.filter(i=>i.w===2),4:items.filter(i=>i.w===4)};
  const sum=a=>a.reduce((s,i)=>s+i.r,0);
  doc.setFillColor(228,0,43);doc.rect(0,0,210,5,'F');
  doc.setFont('helvetica','bold');doc.setFontSize(22);doc.setTextColor(17);
  doc.text('Inventaire des rouleaux',15,20);
  doc.setFont('helvetica','normal');doc.setFontSize(11);doc.setTextColor(100);
  let y=27; doc.text(`Établi le ${ds} à ${ts}`,15,y);
  const rayon=$('rayon').value.trim(); if(rayon){y+=6;doc.text(`Rayon / zone : ${rayon}`,15,y);}
  y+=8;
  const boxes=[['Rouleaux 2 m',sum(g[2]),g[2].length],['Rouleaux 4 m',sum(g[4]),g[4].length],['Total',sum(items),items.length]];
  boxes.forEach(([l,v,n],i)=>{
    const x=15+i*61;
    doc.setFillColor(i===2?17:244,i===2?17:244,i===2?17:244);doc.roundedRect(x,y,57,24,2,2,'F');
    doc.setFontSize(9);doc.setTextColor(i===2?220:100);doc.text(`${l} · ${n} rouleau${n>1?'x':''}`,x+4,y+7);
    doc.setFont('helvetica','bold');doc.setFontSize(16);doc.setTextColor(i===2?255:17);doc.text(`${fp(v)} m²`,x+4,y+17);
    doc.setFont('helvetica','normal');
  });
  const body=[];
  [2,4].forEach(w=>{
    if(!g[w].length) return;
    g[w].forEach(i=>body.push([String(items.indexOf(i)+1),i.ref||'—',`${w} m`,`${fp(i.tour)} m`,String(i.sp),`${fp(i.r)} m²`]));
    body.push([{content:`Sous-total rouleaux ${w} m (${g[w].length})`,colSpan:5,styles:{fontStyle:'bold',fillColor:[244,244,244]}},{content:`${fp(sum(g[w]))} m²`,styles:{fontStyle:'bold',fillColor:[244,244,244],halign:'right'}}]);
  });
  doc.autoTable({
    startY:y+32,
    head:[['#','Référence','Largeur','Tour','Spires','Quantité']],
    body,
    foot:[[{content:'Total général',colSpan:5},{content:`${fp(sum(items))} m²`,styles:{halign:'right'}}]],
    theme:'plain',
    styles:{font:'helvetica',fontSize:10,cellPadding:2.5,textColor:17,lineColor:[227,227,227],lineWidth:{bottom:0.2}},
    headStyles:{fillColor:[17,17,17],textColor:255,fontStyle:'bold'},
    footStyles:{fillColor:[228,0,43],textColor:255,fontStyle:'bold',fontSize:11},
    columnStyles:{0:{cellWidth:10},2:{cellWidth:20},3:{halign:'right',cellWidth:24},4:{halign:'right',cellWidth:18},5:{halign:'right',cellWidth:32}},
    margin:{left:15,right:15,bottom:18}
  });
  const tube=fp(num($('tube').value)||0.34);
  const pages=doc.getNumberOfPages();
  for(let p=1;p<=pages;p++){
    doc.setPage(p);doc.setFontSize(8);doc.setTextColor(120);
    doc.text(`Calcul : (tour + ${tube}) ÷ 2 × spires × largeur`,15,289);
    doc.text(`Page ${p} / ${pages}`,195,289,{align:'right'});
  }
  const fname=`inventaire-rouleaux-${now.toISOString().slice(0,10)}.pdf`;
  if(!downloads){
    try{
      const url=URL.createObjectURL(doc.output('blob')), a=document.createElement('a');
      a.href=url;a.download=fname;document.body.appendChild(a);a.click();a.remove();
      setTimeout(()=>URL.revokeObjectURL(url),10000);toast('PDF téléchargé.');
    }catch(e){toast('Le PDF ne peut pas être téléchargé ici.');}
    return;
  }
  try{
    await downloads.save({filename:fname,data:doc.output('blob')});
    toast('PDF enregistré.');
  }catch(err){
    const c=err&&err.code;
    if(c==='declined') toast('Téléchargement annulé.');
    else if(c==='rate_limited') toast('Patientez un instant puis réessayez.');
    else if(c==='host_unavailable') toast('L’application ne peut pas enregistrer de fichier : ouvrez la page dans un navigateur.');
    else toast('Le PDF ne peut pas être enregistré sur cet affichage.');
  }
});

render();renderList();
}
</script>
</body>
</html>
